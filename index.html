<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reset" />
  <meta name="description" content="A personal life reset dashboard for sleep, university, fitness, money and weekly planning." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Reset</title>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="dateLabel">TODAY</p>
        <h1 id="pageTitle">Today</h1>
      </div>
      <button class="icon-button" id="settingsBtn" aria-label="Open settings">•••</button>
    </header>

    <main id="mainContent" class="main-content"></main>

    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab active" data-tab="today"><span>◉</span><small>Today</small></button>
      <button class="tab" data-tab="plan"><span>▤</span><small>Plan</small></button>
      <button class="tab" data-tab="university"><span>⌁</span><small>Uni</small></button>
      <button class="tab" data-tab="progress"><span>↗</span><small>Progress</small></button>
      <button class="tab" data-tab="life"><span>◇</span><small>Life</small></button>
    </nav>
  </div>

  <dialog id="settingsDialog" class="sheet">
    <form method="dialog" class="sheet-card">
      <div class="sheet-handle"></div>
      <div class="row between center">
        <div><p class="eyebrow">APP</p><h2>Settings & backup</h2></div>
        <button class="icon-button" value="cancel" aria-label="Close">×</button>
      </div>
      <div class="settings-list">
        <button type="button" class="settings-item" id="exportBtn"><span>Export backup</span><b>JSON</b></button>
        <label class="settings-item file-label"><span>Import backup</span><b>Choose file</b><input id="importInput" type="file" accept="application/json" hidden /></label>
        <button type="button" class="settings-item" id="installHelpBtn"><span>Add to iPhone Home Screen</span><b>How</b></button>
        <button type="button" class="settings-item danger" id="eraseBtn"><span>Erase all app data</span><b>Reset</b></button>
      </div>
      <p class="tiny muted">All data is stored locally in your browser. Export a backup occasionally.</p>
    </form>
  </dialog>

  <dialog id="modal" class="sheet">
    <div id="modalContent" class="sheet-card"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
