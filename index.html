<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reset" />
  <meta name="description" content="A personal life dashboard for daily planning, university, fitness, money and weekly reset." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=3.6.0" />
  <title>Reset</title>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="header-copy">
        <p class="eyebrow" id="dateLabel">TODAY</p>
        <h1 id="pageTitle">Today</h1>
      </div>
      <button class="icon-button" id="settingsBtn" aria-label="Open settings"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg></button>
    </header>

    <main id="mainContent" class="main-content"></main>

    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab active" data-tab="today"><span class="tab-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.2 2.2 4.8-5"/></svg></span><small>Today</small></button>
      <button class="tab" data-tab="week"><span class="tab-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3.5V7M16 3.5V7M3.5 9h17M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01"/></svg></span><small>Week</small></button>
      <button class="tab" data-tab="university"><span class="tab-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-5 9 5-9 5-9-5zM6 13v4c3 2 9 2 12 0v-4M21 10v6"/></svg></span><small>Uni</small></button>
      <button class="tab" data-tab="money"><span class="tab-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h14.5A2.5 2.5 0 0 1 21 10v7.5A2.5 2.5 0 0 1 18.5 20h-14A2.5 2.5 0 0 1 2 17.5v-11A2.5 2.5 0 0 1 4.5 4H17"/><path d="M16 12h5v4h-5a2 2 0 0 1 0-4z"/></svg></span><small>Money</small></button>
      <button class="tab" data-tab="more"><span class="tab-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="5" height="5" rx="1.2"/><rect x="15" y="4" width="5" height="5" rx="1.2"/><rect x="4" y="15" width="5" height="5" rx="1.2"/><rect x="15" y="15" width="5" height="5" rx="1.2"/></svg></span><small>More</small></button>
    </nav>
  </div>

  <dialog id="settingsDialog" class="sheet">
    <form method="dialog" class="sheet-card">
      <div class="sheet-handle"></div>
      <div class="row between center">
        <div><p class="eyebrow">APP</p><h2>Settings & backup</h2></div>
        <button class="icon-button" value="cancel" aria-label="Close"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="settings-list">
        <button type="button" class="settings-item" id="exportBtn"><span>Export backup</span><b>JSON</b></button>
        <label class="settings-item file-label"><span>Import backup</span><b>Choose file</b><input id="importInput" type="file" accept="application/json" hidden /></label>
        <button type="button" class="settings-item" id="installHelpBtn"><span>Add to iPhone Home Screen</span><b>How</b></button>
        <button type="button" class="settings-item" id="storageProtectionBtn"><span>Local data protection</span><b id="storageProtectionStatus">Checking…</b></button>
        <div class="settings-item settings-info"><span>Automatic backup copy</span><b id="backupConfidenceStatus">Checking…</b></div>
        <button type="button" class="settings-item update-ready-item hidden" id="updateReadyBtn"><span>Update ready</span><b id="updateReadyLabel">Reload</b></button>
        <button type="button" class="settings-item" id="dataHealthBtn"><span>Check Reset data</span><b id="dataHealthStatus">Check</b></button>
        <button type="button" class="settings-item hidden" id="recoverySnapshotBtn"><span>Recovery snapshot</span><b id="recoverySnapshotStatus">Restore</b></button>
        <div class="settings-item settings-info"><span>App version</span><b id="versionLabel">v3.6.0</b></div>
        <button type="button" class="settings-item danger" id="eraseBtn"><span>Erase all app data</span><b>Reset</b></button>
      </div>
      <p class="tiny muted">Reset saves locally and keeps an automatic second browser copy. Settings shows when that copy was last updated. Clearing website data or deleting the web app can still remove both copies.</p>
    </form>
  </dialog>

  <dialog id="modal" class="sheet">
    <div id="modalContent" class="sheet-card"></div>
  </dialog>

  <script src="app.js?v=3.6.0"></script>
</body>
</html>
